<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Lumina – a dreamy, futuristic weather app with live weather and a 7-day forecast, powered by the SheCodes Weather API."
    />
    <meta name="theme-color" content="#1b1038" />
    <title>Lumina Weather</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23ff7ac8' d='M12 2c.6 5.5 4.5 9.4 10 10-5.5.6-9.4 4.5-10 10-.6-5.5-4.5-9.4-10-10 5.5-.6 9.4-4.5 10-10z'/%3E%3C/svg%3E" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Quicksand:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/style.css" />

    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
  </head>

  <body data-weather="clear">
    <!-- Clipart: one hidden sprite, reused everywhere with <use> -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <defs>
        <symbol id="i-search" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" />
        </symbol>

        <symbol id="i-locate" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3" />
          <circle cx="12" cy="12" r="8" />
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
        </symbol>

        <symbol id="i-pin" viewBox="0 0 24 24">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
          <circle cx="12" cy="10" r="3" />
        </symbol>

        <symbol id="i-drop" viewBox="0 0 24 24">
          <path d="M12 2.7c3.4 4.2 6 7.2 6 10.6a6 6 0 0 1-12 0c0-3.4 2.6-6.4 6-10.6z" />
        </symbol>

        <symbol id="i-wind" viewBox="0 0 24 24">
          <path d="M9.6 4.6A2 2 0 1 1 11 8H2m10.6 11.4A2 2 0 1 0 14 16H2m15.7-8.3A2.5 2.5 0 1 1 19.5 12H2" />
        </symbol>

        <symbol id="i-thermo" viewBox="0 0 24 24">
          <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z" />
        </symbol>

        <symbol id="i-sparkle" viewBox="0 0 24 24">
          <path d="M12 2c.6 5.5 4.5 9.4 10 10-5.5.6-9.4 4.5-10 10-.6-5.5-4.5-9.4-10-10 5.5-.6 9.4-4.5 10-10z" />
        </symbol>

        <symbol id="i-cloud" viewBox="0 0 24 24">
          <path d="M6.5 19a4.5 4.5 0 0 1-.4-8.98A6.5 6.5 0 0 1 18.6 9.2 4.9 4.9 0 0 1 18 19H6.5z" />
        </symbol>

        <symbol id="i-calendar" viewBox="0 0 24 24">
          <rect x="3" y="4.5" width="18" height="16.5" rx="3" />
          <path d="M3 10h18M8 2.5v4M16 2.5v4" />
        </symbol>

        <symbol id="i-heart" viewBox="0 0 24 24">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
        </symbol>

        <symbol id="i-github" viewBox="0 0 16 16">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
        </symbol>
      </defs>
    </svg>

    <!-- Dreamy background -->
    <div class="sky" aria-hidden="true">
      <span class="orb orb-1"></span>
      <span class="orb orb-2"></span>
      <span class="orb orb-3"></span>

      <svg class="deco cloud cloud-1 icon-fill"><use href="#i-cloud" /></svg>
      <svg class="deco cloud cloud-2 icon-fill"><use href="#i-cloud" /></svg>
      <svg class="deco cloud cloud-3 icon-fill"><use href="#i-cloud" /></svg>

      <svg class="deco spark spark-1 icon-fill"><use href="#i-sparkle" /></svg>
      <svg class="deco spark spark-2 icon-fill"><use href="#i-sparkle" /></svg>
      <svg class="deco spark spark-3 icon-fill"><use href="#i-sparkle" /></svg>
      <svg class="deco spark spark-4 icon-fill"><use href="#i-sparkle" /></svg>
      <svg class="deco spark spark-5 icon-fill"><use href="#i-sparkle" /></svg>
    </div>

    <div class="app">
      <div class="brand">
        <svg class="brand-mark icon-fill" aria-hidden="true"><use href="#i-sparkle" /></svg>
        <span>Lumina</span>
        <svg class="brand-mark icon-fill" aria-hidden="true"><use href="#i-sparkle" /></svg>
      </div>

      <section class="card" id="card">
        <!-- Search engine + "use my location" -->
        <div class="toolbar">
          <form class="search" id="search-form" role="search">
            <label for="search-input" class="sr-only">Search for a city</label>
            <svg class="search-icon icon" aria-hidden="true"><use href="#i-search" /></svg>
            <input
              type="search"
              id="search-input"
              placeholder="Search a city…"
              autocomplete="off"
              required
            />
            <button type="submit" class="search-button">Search</button>
          </form>

          <button
            type="button"
            class="icon-button"
            id="locate-button"
            aria-label="Use my location"
            title="Use my location"
          >
            <svg class="icon" aria-hidden="true"><use href="#i-locate" /></svg>
          </button>
        </div>

        <!-- Recent searches + units -->
        <div class="controls">
          <div class="recent" id="recent" hidden>
            <span class="recent-label">Recent</span>
            <div class="recent-list" id="recent-list"></div>
            <button type="button" class="link-button" id="clear-recent">Clear</button>
          </div>

          <div class="units" role="group" aria-label="Temperature units">
            <button type="button" class="units-button" data-units="metric" aria-pressed="true">°C</button>
            <button type="button" class="units-button" data-units="imperial" aria-pressed="false">°F</button>
          </div>
        </div>

        <p class="status" id="status" role="status" aria-live="polite"></p>

        <!-- Current weather -->
        <div class="weather" aria-live="polite">
          <div class="weather-top">
            <div class="place">
              <p class="location" id="location" hidden>
                <svg class="icon" aria-hidden="true"><use href="#i-pin" /></svg>
                <span id="country"></span>
              </p>
              <h1 class="city" id="city">…</h1>
              <p class="time" id="time"></p>
              <p class="description">
                <svg class="icon-fill" aria-hidden="true"><use href="#i-sparkle" /></svg>
                <span id="description">Loading</span>
              </p>
            </div>

            <div class="hero">
              <div class="icon-wrap">
                <img id="icon" alt="" width="84" height="84" />
              </div>
              <div class="temp">
                <span class="temp-value" id="temperature">--</span>
                <span class="temp-unit" id="temperature-unit">°C</span>
              </div>
            </div>
          </div>

          <ul class="stats">
            <li class="stat">
              <span class="stat-icon"><svg class="icon" aria-hidden="true"><use href="#i-drop" /></svg></span>
              <span class="stat-label">Humidity</span>
              <strong class="stat-value" id="humidity">--</strong>
            </li>
            <li class="stat">
              <span class="stat-icon"><svg class="icon" aria-hidden="true"><use href="#i-wind" /></svg></span>
              <span class="stat-label">Wind</span>
              <strong class="stat-value" id="wind-speed">--</strong>
            </li>
            <li class="stat" id="feels-like-item" hidden>
              <span class="stat-icon"><svg class="icon" aria-hidden="true"><use href="#i-thermo" /></svg></span>
              <span class="stat-label">Feels like</span>
              <strong class="stat-value" id="feels-like">--</strong>
            </li>
          </ul>
        </div>

        <!-- Forecast -->
        <section class="forecast" aria-labelledby="forecast-title">
          <div class="forecast-header">
            <h2 class="forecast-title" id="forecast-title">
              <svg class="icon" aria-hidden="true"><use href="#i-calendar" /></svg>
              Forecast
            </h2>
            <p class="forecast-sub" id="forecast-sub"></p>
          </div>
          <p class="forecast-note" id="forecast-note">Loading the forecast…</p>
          <ul class="forecast-list" id="forecast-list"></ul>
        </section>
      </section>

      <footer class="footer">
        <p>
          Coded with
          <svg class="heart icon-fill" aria-hidden="true"><use href="#i-heart" /></svg>
          by ftlcollective
        </p>
        <nav class="footer-links" aria-label="Project links">
          <a href="https://github.com/ftlcollective" target="_blank" rel="noopener">
            <svg class="icon-fill" aria-hidden="true"><use href="#i-github" /></svg>
            GitHub profile
          </a>
          <a href="https://github.com/ftlcollective/luminaweatherapp" target="_blank" rel="noopener">
            <svg class="icon-fill" aria-hidden="true"><use href="#i-github" /></svg>
            GitHub repository
          </a>
        </nav>
        <p class="credit">Weather data from the SheCodes Weather API</p>
      </footer>
    </div>

    <script src="src/index.js"></script>
  </body>
</html>
